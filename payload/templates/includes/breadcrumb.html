<!--
includes/breadcrumb.html
Two-level breadcrumb: a link to the parent page, then the current page.
Usage: include this file with parent_label, parent_url and current (all text), for example
parent_label="Extensions" parent_url=list_url current="Edit extension".
The last item is the current page (aria-current), not a link.
-->
<nav aria-label="Breadcrumb" class="mb-4 text-sm">
  <ol class="flex flex-wrap items-center gap-1.5 text-txt-secondary">
    <li><a href="{{ parent_url }}" class="rounded hover:text-txt-primary hover:underline focus-visible:outline-2 focus-visible:outline-accent">{{ parent_label }}</a></li>
    <li aria-hidden="true">{% include 'includes/icon.html' with name='chevron-right' class='size-4' %}</li>
    <li aria-current="page" class="font-medium text-txt-primary">{{ current }}</li>
  </ol>
</nav>
