<!--
attendance/_upload_form.html
The "Save and upload" button, for the person who may upload (the view only includes it then).
Usage: include with sheet=sheet, submit_token=submit_token, upload_blocker=upload_blocker.
The one-time token makes a double tap upload once. The confirm dialog comes from ui.js (data-confirm).
When something blocks the upload the button is disabled and the reason is written beside it; the service
refuses again anyway, so this is only a convenience.
-->
{% load people_tags %}
<form method="post" action="{% role_url 'sheet_upload' sheet.pk %}"
      data-confirm="The numbers are frozen and the sheet is locked. Only an admin can open it again to correct it."
      data-confirm-title="Save and upload this sheet?" data-confirm-text="Save and upload">
  {% csrf_token %}
  <input type="hidden" name="submit_token" value="{{ submit_token }}">
  <button type="submit" class="btn btn-primary min-h-[44px] text-base"{% if upload_blocker %} disabled aria-describedby="upload-blocker"{% endif %}>Save and upload</button>
</form>
{% if upload_blocker %}<p id="upload-blocker" class="mt-2 text-sm text-txt-secondary">{{ upload_blocker }}</p>{% endif %}
