<!-- Version picker (include). Not a page: no blocks.
Context: statuses (list of VersionStatus: version, available, reason), version (the chosen BibleVersion), request.
Usage: include "bible/_version_picker.html" inside a content block.
Each version is a POST button; a locked version is disabled and shows why in text. -->
<section class="card p-4" aria-label="Bible version">
  <h2 class="label mb-2">Version</h2>
  <ul class="flex flex-wrap gap-2">
    {% for status in statuses %}
      <li>
        <form method="post" action="{% url 'bible:set_version' %}">
          {% csrf_token %}
          <input type="hidden" name="version" value="{{ status.version.code }}">
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button type="submit"
                  class="btn {% if status.version.code == version.code %}btn-primary{% else %}btn-secondary{% endif %} min-h-11"
                  {% if not status.available %}disabled aria-disabled="true"{% endif %}
                  {% if status.version.code == version.code %}aria-current="true"{% endif %}>
            {% if not status.available %}<span class="mr-1">{% include "includes/icon.html" with name="lock-closed" class="h-4 w-4" %}</span>{% endif %}
            {{ status.version.label }}
          </button>
        </form>
        {% if not status.available %}
          <p class="field-help mt-1 max-w-48">Locked. {{ status.reason }}</p>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</section>
