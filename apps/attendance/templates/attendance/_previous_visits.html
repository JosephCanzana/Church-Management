<!--
attendance/_previous_visits.html
The "visited before" part of the "same person?" prompt. Include it inside the `pending` block of
sheet_workspace.html, after the list of matching people:
    {% if pending.previous_visits %}{% include 'attendance/_previous_visits.html' %}{% endif %}
Needs: pending (name, previous_visits, gender, age_network), sheet, can_convert, convert_token.
Each earlier visit is {first_timer_id, sheet_id, date}. "Same person" converts that earlier first timer and
ticks the new member present on THIS sheet (mark_here); "A new person" is the prompt's existing confirm_new form.
-->
{% load people_tags %}
<ul class="mt-3 divide-y divide-border rounded-xl border border-border bg-surface">
  {% for visit in pending.previous_visits %}
  <li class="flex flex-wrap items-center justify-between gap-3 px-4 py-3">
    <p class="text-base text-txt-primary">{{ pending.name }} <span class="text-sm text-txt-secondary">visited before on {{ visit.date|date:"j F Y" }}</span></p>
    {% if can_convert %}
    <form method="post" action="{% role_url 'sheet_first_timer_convert' sheet.pk %}">
      {% csrf_token %}
      <input type="hidden" name="first_timer_id" value="{{ visit.first_timer_id }}">
      <input type="hidden" name="submit_token" value="{{ convert_token }}">
      <input type="hidden" name="mark_here" value="1">
      <input type="hidden" name="gender" value="{{ pending.gender }}">
      <input type="hidden" name="age_network" value="{{ pending.age_network }}">
      <button type="submit" class="btn btn-primary min-h-[44px]"
              data-confirm="This creates an account for {{ pending.name }} and marks them present today. The earlier visit stays in their history."
              data-confirm-title="Same person?" data-confirm-text="Yes, make a member">
        Same person: make a member
      </button>
    </form>
    {% else %}
    <p class="text-sm text-txt-secondary">Ask the coordinator to make them a member.</p>
    {% endif %}
  </li>
  {% endfor %}
</ul>
