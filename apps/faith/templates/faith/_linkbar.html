{% comment %}
faith/_linkbar.html
The small link bar on every Goals page: Today | All goals, plus a New goal button.
Brick 4 adds History here.
Usage: include with active='today' or active='all'.
{% endcomment %}
{% load static %}
<div class="mb-5 flex flex-wrap items-center justify-between gap-3">
  <nav aria-label="Goals pages" class="flex gap-1 rounded-full border border-border bg-surface p-1">
    <a href="{% url 'faith:goals' %}"
       class="inline-flex min-h-10 items-center rounded-full px-4 text-base transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent {% if active == 'today' %}bg-primary font-medium text-on-primary{% else %}text-txt-secondary hover:text-txt-primary{% endif %}"
       {% if active == 'today' %}aria-current="page"{% endif %}>Today</a>
    <a href="{% url 'faith:goal_all' %}"
       class="inline-flex min-h-10 items-center rounded-full px-4 text-base transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent {% if active == 'all' %}bg-primary font-medium text-on-primary{% else %}text-txt-secondary hover:text-txt-primary{% endif %}"
       {% if active == 'all' %}aria-current="page"{% endif %}>All goals</a>
  </nav>
  <a href="{% url 'faith:goal_new' %}" class="btn btn-primary">
    <svg class="h-5 w-5" aria-hidden="true"><use href="{% static 'icons/sprite.svg' %}#plus"></use></svg>
    New goal
  </a>
</div>
