{% extends "base_app.html" %}
{% block content %}
<div class="p-6">
  <h1 class="text-2xl font-semibold">This is the {{ label }} page</h1>
  <p class="mt-2 text-sm opacity-70">Temporary placeholder. Signed in as {{ request.user }}.</p>
  <form method="post" action="{% url 'accounts:logout' %}" class="mt-4">
    {% csrf_token %}
    <button type="submit" class="underline">Log out</button>
  </form>
</div>
{% endblock %}
