<!--
accounts/reset_invalid.html: shown for any reset link that is bad, expired or already used.
Extends base_public.html and fills: title, content.
Context: none.
-->
{% extends "base_public.html" %}

{% block title %}Link no longer valid{% endblock %}

{% block content %}
<div class="w-full max-w-md">
  <div class="card p-6 sm:p-8">
    <h1 class="text-2xl font-semibold text-txt-primary">This link is no longer valid</h1>
    <p class="mt-3 text-base text-txt-secondary">
      It may have expired or already been used. Ask for a new one.
    </p>
    <p class="mt-6 flex flex-wrap gap-3">
      <a href="{% url 'accounts:forgot_password' %}" class="btn btn-primary min-h-11">Request a new link</a>
      <a href="{% url 'accounts:login' %}" class="btn btn-secondary min-h-11">Back to log in</a>
    </p>
  </div>
</div>
{% endblock %}
