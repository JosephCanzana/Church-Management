{% extends "base_public.html" %}
{% block title %}Request received{% endblock %}
{% block content %}
<section class="mx-4 w-full max-w-lg rounded-2xl border border-border bg-surface p-8 text-center shadow-sm">
  <h1 class="text-2xl font-bold text-txt-primary">Request received</h1>
  <p class="mt-3 text-txt-secondary">If your request can be processed, account details or next steps will be sent to the email you provided.</p>
  <a class="btn btn-primary mt-6" href="{% url 'accounts:login' %}">Return to login</a>
</section>
{% endblock %}
