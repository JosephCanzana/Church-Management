{% comment %}
events/_field.html
One form field: label, the input, help text and inline errors.
Usage: include with field=form.title
{% endcomment %}
<div>
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
