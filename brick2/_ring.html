<!--
faith/_ring.html
Progress ring drawn as inline SVG (no JavaScript). The track and the arc use currentColor through text tokens.
Pass: ring (pct, dash, circumference, text from faith.overview.make_ring; the text is printed in the middle),
label (one sentence for screen readers), class (optional size classes, default size-28).
Include example: include faith/_ring.html with ring=ov.ring label="Share of scheduled days done"
-->
<svg viewBox="0 0 100 100" class="{{ class|default:'size-28' }} shrink-0" role="img" aria-label="{{ label }}">
  <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="10" class="text-border"/>
  {% if ring.pct %}
  <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"
          class="text-accent" stroke-dasharray="{{ ring.dash }} {{ ring.circumference }}" transform="rotate(-90 50 50)"/>
  {% endif %}
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="currentColor"
        class="font-mono text-txt-primary" font-size="20" font-weight="600">{{ ring.text }}</text>
</svg>
