services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    ports:
      # Host access (psql, DBeaver, etc.) on 5433; bound to localhost only
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      # Exposed on localhost port 8002
      - "127.0.0.1:8002:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  # Database GUI: http://localhost:5050
  # First time: Add New Server -> Host: db, Port: 5432,
  # Username/Password/Database: the POSTGRES_* values from your .env
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: