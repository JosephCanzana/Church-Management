<header
  x-data="{ open: false, dark: document.documentElement.classList.contains('dark') }"
  @keydown.escape.window="open = false"
  class="sticky top-0 z-40 border-b border-border bg-surface"
>
  <nav class="mx-auto flex h-14 max-w-7xl items-center justify-between px-3 md:grid md:grid-cols-[1fr_auto_1fr]" aria-label="Main">

    <a href="/" class="flex items-center gap-1.5 justify-self-start text-sm font-semibold sm:text-base">
      {% include "includes/logo.html" with variant="mark" size="size-6" decorative=True %}
      Jesus Is Lord Church
    </a>

    <ul class="hidden items-center gap-0.5 justify-self-center md:flex">
      <li>
        <a href="/"
           class="rounded-md px-2.5 py-1.5 text-sm font-medium hover:bg-bg
                  {% if request.path == '/' %}text-txt-primary{% else %}text-txt-secondary{% endif %}">
          Home
        </a>
      </li>
      <li>
        <a href="#about" class="rounded-md px-2.5 py-1.5 text-sm font-medium text-txt-secondary hover:bg-bg">About</a>
      </li>
      <li>
        <a href="#give" class="rounded-md px-2.5 py-1.5 text-sm font-medium text-txt-secondary hover:bg-bg">Give</a>
      </li>
    </ul>

    <div class="flex items-center gap-1 justify-self-end">
      <button type="button"
              class="btn btn-ghost !p-1.5"
              :aria-label="dark ? 'Switch to light mode' : 'Switch to dark mode'"
              @click="dark = toggleMode() === 'dark'">
        <span x-show="!dark" class="inline-flex">
          {% include "includes/icon.html" with name="moon" %}
        </span>
        <span x-show="dark" x-cloak class="inline-flex">
          {% include "includes/icon.html" with name="sun" %}
        </span>
      </button>

      <a href="#" class="btn btn-primary !px-3 !py-1.5 text-sm">Login</a>

      <button type="button"
              class="btn btn-ghost !p-1.5 md:hidden"
              :aria-label="open ? 'Close menu' : 'Open menu'"
              :aria-expanded="open"
              aria-controls="public-mobile-menu"
              @click="open = !open">
        <span x-show="!open" class="inline-flex">
          {% include "includes/icon.html" with name="bars-3" %}
        </span>
        <span x-show="open" x-cloak class="inline-flex">
          {% include "includes/icon.html" with name="x-mark" %}
        </span>
      </button>
    </div>
  </nav>

  <div id="public-mobile-menu"
       x-show="open" x-cloak
       x-transition.opacity.duration.150ms
       @click.outside="open = false"
       class="absolute inset-x-0 top-full border-b border-border bg-surface shadow-lg md:hidden">
    <ul class="mx-auto max-w-7xl space-y-0.5 px-3 py-2">
      <li><a href="/" class="block rounded-md px-2.5 py-2 text-sm font-medium text-txt-primary hover:bg-bg">Home</a></li>
      <li><a href="#about" class="block rounded-md px-2.5 py-2 text-sm font-medium text-txt-secondary hover:bg-bg" @click="open = false">About</a></li>
      <li><a href="#give" class="block rounded-md px-2.5 py-2 text-sm font-medium text-txt-secondary hover:bg-bg" @click="open = false">Give</a></li>
    </ul>
  </div>
</header>
