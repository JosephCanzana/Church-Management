{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sandbox Test</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <script defer src="{% static 'js/alpine.min.js' %}"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md space-y-4 text-center">

        <h1 class="text-3xl font-bold text-blue-600">Tailwind Test</h1>
        <p class="text-gray-600">If this text is styled, Tailwind works.</p>

        <div x-data="{ open: false, count: 0 }" class="space-y-3">
            <button
                @click="open = !open"
                class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded transition"
            >
                Toggle Message
            </button>

            <p x-show="open" x-transition class="text-green-600 font-semibold">
                Alpine toggle works!
            </p>

            <div class="flex items-center justify-center gap-3">
                <button @click="count++" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">
                    +
                </button>
                <span x-text="count" class="text-xl font-mono"></span>
                <button @click="count--" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">
                    −
                </button>
            </div>
        </div>

    </div>

</body>
</html>
